<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Technology stack</title><desc id="d">Languages, platforms and delivery capabilities presented through recognizable standalone technology marks.</desc>
<defs>
<style>
:root{--bg:#F8F5EB;--top:#FFFDF6;--card:#FFFDF7;--border:#D8C693;--gold:#A7771C;--text:#172117;--muted:#7D7461;--soft:#E9DDBB}
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.h{font-size:28px;font-weight:800}.s{font-size:14px}.k{font-size:18px;font-weight:800;letter-spacing:.4px}.f{font-size:13px}.word{font-family:Arial,sans-serif;font-weight:800}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
@media(prefers-color-scheme:dark){:root{--bg:#0C0E0B;--top:#121612;--card:#111612;--border:#51441D;--gold:#E6C87A;--text:#F8F3E3;--muted:#A7A18E;--soft:#51441D}}
</style>
<linearGradient id="kotlin" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#7F52FF"/><stop offset=".5" stop-color="#E44857"/><stop offset="1" stop-color="#FF8A00"/></linearGradient>
</defs>
<rect x="8" y="8" width="1184" height="504" rx="24" fill="var(--bg)" stroke="var(--gold)" stroke-width="2"/>
<rect x="24" y="24" width="1152" height="52" rx="17" fill="var(--top)" stroke="var(--border)"/>
<circle cx="48" cy="50" r="6" fill="#E38F7D"/><circle cx="68" cy="50" r="6" fill="#D9B45E"/><circle cx="88" cy="50" r="6" fill="#7DAA81"/>
<text x="600" y="55" text-anchor="middle" fill="var(--muted)" class="s">mouaz@github:~$ ./stack --inspect --mode=logos</text>
<text x="56" y="124" fill="var(--text)" class="h">&gt; stack.map --scope=engineering</text>
<text x="56" y="151" fill="var(--muted)" class="s">Languages, platforms and delivery capabilities used across backend, systems, web, mobile and AI work.</text>

