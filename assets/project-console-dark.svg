<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title description">
<title id="title">Mouaz selected project evidence</title>
<desc id="description">Six selected engineering projects across AI DevOps, Android, full-stack integration, C++ product development, concurrency and filesystems.</desc>
<defs>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .title { fill:#ECF8F3; font-size:28px; font-weight:900; letter-spacing:-.4px; }
    .label { fill:#86A398; font-size:11px; font-weight:800; letter-spacing:1.6px; }
    .body { fill:#ECF8F3; font-size:14px; }
    .small { fill:#86A398; font-size:12px; }
    .tiny { fill:#86A398; font-size:10px; letter-spacing:.7px; }
    .chip { fill:#ECF8F3; font-size:10px; font-weight:800; letter-spacing:.25px; }
    .pulse { animation:pulse 2.1s ease-in-out infinite; }
    .flow { animation:dash 2.4s linear infinite; }
    .scan { animation:scan 5.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
    @keyframes dash { to{stroke-dashoffset:-32} }
    @keyframes scan { 0%,100%{transform:translateY(0)} 50%{transform:translateY(390px)} }
    @media (prefers-reduced-motion: reduce) { .pulse,.flow,.scan{animation:none !important} }
  </style>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06100E"/>
    <stop offset=".55" stop-color="#0E211B"/>
    <stop offset="1" stop-color="#06100E"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#38D6AE"/>
    <stop offset=".55" stop-color="#5BC9D7"/>
    <stop offset="1" stop-color="#D9B963"/>
  </linearGradient>
  <radialGradient id="glow" cx="75%" cy="30%" r="70%">
    <stop offset="0" stop-color="#38D6AE" stop-opacity=".18"/>
    <stop offset=".65" stop-color="#5BC9D7" stop-opacity=".04"/>
    <stop offset="1" stop-color="#06100E" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#1B4438" stroke-width=".7" opacity=".32"/>
  </pattern>
  <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r=".8" fill="#38D6AE" opacity=".18"/>
  </pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="570" rx="24" fill="url(#surface)"/>
<rect x="4" y="4" width="1192" height="562" rx="21" fill="none" stroke="url(#accent)" stroke-width="1.6"/>
