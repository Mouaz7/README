<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
<title id="title">Mouaz engineering operating system</title>
<desc id="description">A layered engineering map showing inputs, architecture layers, delivery outputs and cross-cutting quality controls.</desc>
<defs>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .title { fill:#10231C; font-size:28px; font-weight:900; letter-spacing:-.4px; }
    .label { fill:#5D776D; font-size:11px; font-weight:800; letter-spacing:1.6px; }
    .body { fill:#10231C; font-size:14px; }
    .small { fill:#5D776D; font-size:12px; }
    .tiny { fill:#5D776D; font-size:10px; letter-spacing:.7px; }
    .chip { fill:#10231C; font-size:10px; font-weight:800; letter-spacing:.25px; }
    .pulse { animation:pulse 2.1s ease-in-out infinite; }
    .flow { animation:dash 2.4s linear infinite; }
    .scan { animation:scan 5.8s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
    @keyframes dash { to{stroke-dashoffset:-32} }
    @keyframes scan { 0%,100%{transform:translateY(0)} 50%{transform:translateY(390px)} }
    @media (prefers-reduced-motion: reduce) { .pulse,.flow,.scan{animation:none !important} }
  </style>
  <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F5F2EA"/>
    <stop offset=".55" stop-color="#EAF3EE"/>
    <stop offset="1" stop-color="#F5F2EA"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#137F68"/>
    <stop offset=".55" stop-color="#247D8A"/>
    <stop offset="1" stop-color="#946D1D"/>
  </linearGradient>
  <radialGradient id="glow" cx="75%" cy="30%" r="70%">
    <stop offset="0" stop-color="#137F68" stop-opacity=".18"/>
    <stop offset=".65" stop-color="#247D8A" stop-opacity=".04"/>
    <stop offset="1" stop-color="#F5F2EA" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#B8D4C9" stroke-width=".7" opacity=".32"/>
  </pattern>
  <pattern id="micro" width="8" height="8" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r=".8" fill="#137F68" opacity=".18"/>
  </pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="650" rx="24" fill="url(#surface)"/>
<rect width="1200" height="650" rx="24" fill="url(#grid)"/>
<rect x="4" y="4" width="1192" height="642" rx="21" fill="none" stroke="url(#accent)" stroke-width="1.6"/>
<text x="38" y="52" class="title">&gt; ./engineering-os --inspect --trace</text>
<text x="38" y="78" class="small">A system is advanced when responsibilities, evidence and feedback paths are explicit.</text>

<!-- input rail -->
<text x="52" y="126" class="label">INPUT SIGNALS</text>
<g transform="translate(45 147)">
  <rect width="250" height="76" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <circle cx="24" cy="24" r="7" fill="#137F68"/><text x="42" y="29" fill="#10231C" font-size="13" font-weight="900">REQUIREMENTS</text>
  <text x="24" y="53" class="small">Constraints · users · risks</text>
</g>
<g transform="translate(45 242)">
  <rect width="250" height="76" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <circle cx="24" cy="24" r="7" fill="#247D8A"/><text x="42" y="29" fill="#10231C" font-size="13" font-weight="900">EVENTS</text>
  <text x="24" y="53" class="small">Requests · logs · failures</text>
</g>
<g transform="translate(45 337)">
  <rect width="250" height="76" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <circle cx="24" cy="24" r="7" fill="#946D1D"/><text x="42" y="29" fill="#10231C" font-size="13" font-weight="900">EVIDENCE</text>
  <text x="24" y="53" class="small">Tests · metrics · review</text>
</g>
<g transform="translate(45 432)">
  <rect width="250" height="76" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <circle cx="24" cy="24" r="7" fill="#137F68"/><text x="42" y="29" fill="#10231C" font-size="13" font-weight="900">FEEDBACK</text>
  <text x="24" y="53" class="small">Learning · iteration · change</text>
</g>

<!-- architecture core -->
<text x="360" y="126" class="label">ARCHITECTURE CORE / LAYERED RESPONSIBILITIES</text>
<g transform="translate(360 145)">
  <rect width="480" height="68" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <rect width="7" height="68" rx="4" fill="#247D8A"/>
  <text x="25" y="28" fill="#10231C" font-size="14" font-weight="900">01 / EXPERIENCE</text>
  <text x="25" y="50" class="small">React · TypeScript · Kotlin · Android</text>
  <circle cx="448" cy="34" r="9" fill="none" stroke="#247D8A" opacity=".75"/>
  <circle cx="448" cy="34" r="3" fill="#247D8A" class="pulse"/>
</g><g transform="translate(360 227)">
  <rect width="480" height="68" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <rect width="7" height="68" rx="4" fill="#137F68"/>
  <text x="25" y="28" fill="#10231C" font-size="14" font-weight="900">02 / SERVICES</text>
  <text x="25" y="50" class="small">APIs · authentication · business logic</text>
  <circle cx="448" cy="34" r="9" fill="none" stroke="#137F68" opacity=".75"/>
  <circle cx="448" cy="34" r="3" fill="#137F68" class="pulse"/>
</g><g transform="translate(360 309)">
  <rect width="480" height="68" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <rect width="7" height="68" rx="4" fill="#946D1D"/>
  <text x="25" y="28" fill="#10231C" font-size="14" font-weight="900">03 / INTELLIGENCE</text>
  <text x="25" y="50" class="small">LLM workflows · agents · HITL · evaluation</text>
  <circle cx="448" cy="34" r="9" fill="none" stroke="#946D1D" opacity=".75"/>
  <circle cx="448" cy="34" r="3" fill="#946D1D" class="pulse"/>
</g><g transform="translate(360 391)">
  <rect width="480" height="68" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <rect width="7" height="68" rx="4" fill="#137F68"/>
  <text x="25" y="28" fill="#10231C" font-size="14" font-weight="900">04 / DATA</text>
  <text x="25" y="50" class="small">PostgreSQL · MySQL · SQLite · Firebase</text>
  <circle cx="448" cy="34" r="9" fill="none" stroke="#137F68" opacity=".75"/>
  <circle cx="448" cy="34" r="3" fill="#137F68" class="pulse"/>
</g><g transform="translate(360 473)">
  <rect width="480" height="68" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <rect width="7" height="68" rx="4" fill="#247D8A"/>
  <text x="25" y="28" fill="#10231C" font-size="14" font-weight="900">05 / PLATFORM</text>
  <text x="25" y="50" class="small">Linux · Docker · threads · IPC · networking</text>
  <circle cx="448" cy="34" r="9" fill="none" stroke="#247D8A" opacity=".75"/>
  <circle cx="448" cy="34" r="3" fill="#247D8A" class="pulse"/>
</g>

<!-- output rail -->
<text x="900" y="126" class="label">DELIVERY SIGNALS</text>
<g transform="translate(895 147)">
  <rect width="260" height="76" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <text x="22" y="29" fill="#10231C" font-size="13" font-weight="900">RELIABLE BEHAVIOR</text>
  <text x="22" y="53" class="small">Predictable failure handling</text>
</g>
<g transform="translate(895 242)">
  <rect width="260" height="76" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <text x="22" y="29" fill="#10231C" font-size="13" font-weight="900">SECURE CHANGE</text>
  <text x="22" y="53" class="small">Validation · least privilege</text>
</g>
<g transform="translate(895 337)">
  <rect width="260" height="76" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <text x="22" y="29" fill="#10231C" font-size="13" font-weight="900">OBSERVABLE FLOW</text>
  <text x="22" y="53" class="small">Logs · state · auditability</text>
</g>
<g transform="translate(895 432)">
  <rect width="260" height="76" rx="14" fill="#FFFFFF" stroke="#B8D4C9"/>
  <text x="22" y="29" fill="#10231C" font-size="13" font-weight="900">MEASURED DELIVERY</text>
  <text x="22" y="53" class="small">Performance · CI/CD · review</text>
</g>

<!-- flows -->
<g fill="none" stroke="url(#accent)" stroke-width="1.7" stroke-dasharray="8 8" opacity=".72" class="flow">
  <path d="M295 185 C325 185 330 178 360 178"/>
  <path d="M295 280 C325 280 330 260 360 260"/>
  <path d="M295 375 C325 375 330 342 360 342"/>
  <path d="M295 470 C325 470 330 506 360 506"/>
  <path d="M840 178 C865 178 870 185 895 185"/>
  <path d="M840 260 C865 260 870 280 895 280"/>
  <path d="M840 342 C865 342 870 375 895 375"/>
  <path d="M840 506 C865 506 870 470 895 470"/>
</g>

<!-- cross cutting controls -->
<text x="45" y="563" class="label">CROSS-CUTTING CONTROLS</text>
<g transform="translate(45 580)">
  <rect width="267" height="42" rx="11" fill="#EAF3EE" stroke="#137F68" opacity=".95"/>
  <text x="133.5" y="26" text-anchor="middle" class="chip">SECURITY / VALIDATION / SECRETS</text>
</g>
<g transform="translate(326 580)">
  <rect width="267" height="42" rx="11" fill="#EAF3EE" stroke="#247D8A" opacity=".95"/>
  <text x="133.5" y="26" text-anchor="middle" class="chip">TESTING / QUALITY GATES / REVIEW</text>
</g>
<g transform="translate(607 580)">
  <rect width="267" height="42" rx="11" fill="#EAF3EE" stroke="#946D1D" opacity=".95"/>
  <text x="133.5" y="26" text-anchor="middle" class="chip">OBSERVABILITY / AUDIT / FEEDBACK</text>
</g>
<g transform="translate(888 580)">
  <rect width="267" height="42" rx="11" fill="#EAF3EE" stroke="#137F68" opacity=".95"/>
  <text x="133.5" y="26" text-anchor="middle" class="chip">PERFORMANCE / LIMITS / RECOVERY</text>
</g>
</svg>