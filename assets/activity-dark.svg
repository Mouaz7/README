<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Verified engineering evidence</title>
<desc id="desc">Concrete signals from public engineering work instead of decorative progress scores.</desc>
<defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px}.head{font-size:31px;font-weight:900}.sub{font-size:14px}.k{font-size:16px;font-weight:900}.label{font-size:10px;font-weight:900;letter-spacing:1.2px}.body{font-size:13px}.metric{font-size:24px;font-weight:900}.note{font-size:12px}</style>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42BFA3"/><stop offset=".55" stop-color="#56B7C8"/><stop offset="1" stop-color="#E6C87A"/></linearGradient>
<radialGradient id="glow" cx="15%" cy="0" r="85%"><stop stop-color="#42BFA3" stop-opacity=".12"/><stop offset="1" stop-color="#0D1714" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#315047" stroke-width=".6" opacity=".32"/></pattern>
</defs>
<rect width="1200" height="500" rx="26" fill="#0D1714"/>
<rect width="1200" height="500" rx="26" fill="url(#glow)"/>
<rect width="1200" height="500" rx="26" fill="url(#grid)"/>
<rect x="4" y="4" width="1192" height="492" rx="23" fill="none" stroke="url(#border)" stroke-width="2"/>
<text x="42" y="47" class="eyebrow" fill="#42BFA3">EVIDENCE.LOG / PUBLIC WORK / VERIFIED SIGNALS</text>
<text x="42" y="88" class="head" fill="#E8EFEA">Measured behavior, safety controls and shipped systems.</text>
<text x="42" y="116" class="sub" fill="#9BB0A7">No decorative skill percentages. Every signal maps to a repository or implementation.</text>

<g transform="translate(42 148)">
<rect width="535" height="286" rx="18" fill="#12241E" stroke="#315047"/>
<text x="25" y="38" class="k" fill="#42BFA3">CURRENT BUILD / AI-ASSISTED DEVOPS</text>
<line x1="25" y1="55" x2="510" y2="55" stroke="#315047"/>
<text x="25" y="91" class="metric" fill="#E8EFEA">6</text>
<text x="63" y="89" class="body" fill="#E8EFEA">specialized agents coordinated through an orchestrator</text>
<text x="25" y="129" class="label" fill="#E6C87A">CONTROL</text>
<text x="112" y="129" class="body" fill="#E8EFEA">human approval is required before merge</text>
<text x="25" y="165" class="label" fill="#E6C87A">SAFETY</text>
<text x="112" y="165" class="body" fill="#E8EFEA">traffic-light decisions · protected paths · audit trail</text>
<text x="25" y="201" class="label" fill="#E6C87A">QUALITY</text>
<text x="112" y="201" class="body" fill="#E8EFEA">Bandit · Pylint · secret scanning · retry limits</text>
<text x="25" y="237" class="label" fill="#E6C87A">OBSERVE</text>
<text x="112" y="237" class="body" fill="#E8EFEA">Prometheus metrics · Slack reports · structured PRs</text>
<rect x="25" y="255" width="485" height="1" fill="#315047"/>
<text x="25" y="276" class="note" fill="#9BB0A7">Bachelor thesis engineering artifact · BTH · Python</text>
</g>

<g transform="translate(623 148)">
<rect width="535" height="286" rx="18" fill="#12241E" stroke="#315047"/>
<text x="25" y="38" class="k" fill="#E6C87A">ENGINEERING SIGNALS</text>
<line x1="25" y1="55" x2="510" y2="55" stroke="#315047"/>
<text x="25" y="101" class="metric" fill="#42BFA3">667</text>
<text x="91" y="98" class="body" fill="#E8EFEA">automated tests documented in the project suite</text>
<text x="25" y="141" class="label" fill="#56B7C8">SYSTEMS</text>
<text x="112" y="141" class="body" fill="#E8EFEA">threads · IPC · synchronization · filesystems</text>
<text x="25" y="177" class="label" fill="#56B7C8">PRODUCT</text>
<text x="112" y="177" class="body" fill="#E8EFEA">Android · Firebase · realtime application flows</text>
<text x="25" y="213" class="label" fill="#56B7C8">DELIVERY</text>
<text x="112" y="213" class="body" fill="#E8EFEA">Git · Docker · CI/CD · reviewable changes</text>
<rect x="25" y="235" width="485" height="1" fill="#315047"/>
<text x="25" y="260" class="note" fill="#9BB0A7">Proof is shown through source code, tests and project documentation.</text>
</g>

<text x="42" y="472" class="note" fill="#42BFA3">STATUS: building reliable software with observable and reviewable behavior</text>
</svg>