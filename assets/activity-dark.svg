<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">GitHub activity</title><desc id="d">Local theme-aware activity panel without external dependencies.</desc><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.h{font-size:28px;font-weight:800}.s{font-size:14px}.k{font-size:18px;font-weight:800}.b{font-size:15px}</style><rect x="8" y="8" width="1184" height="504" rx="24" fill="#0C0E0B" stroke="#E6C87A" stroke-width="2"/><rect x="24" y="24" width="1152" height="52" rx="17" fill="#121612" stroke="#51441D"/><circle cx="48" cy="50" r="6" fill="#E38F7D"/><circle cx="68" cy="50" r="6" fill="#D9B45E"/><circle cx="88" cy="50" r="6" fill="#7DAA81"/><text x="600" y="55" text-anchor="middle" fill="#A7A18E" class="s">mouaz@github:~$ ./activity --status --source=local</text><text x="56" y="124" fill="#F8F3E3" class="h">&gt; activity.trace --scope=github</text><text x="56" y="151" fill="#A7A18E" class="s">A reliable local overview replaces the broken third-party contribution widget.</text><g transform="translate(56 190)"><rect width="520" height="240" rx="18" fill="#111612" stroke="#51441D"/><text x="24" y="40" fill="#E6C87A" class="k">CURRENT DIRECTION</text><text x="24" y="82" fill="#F8F3E3" class="b">▸ build dependable backend systems</text><text x="24" y="116" fill="#F8F3E3" class="b">▸ deepen systems and concurrency knowledge</text><text x="24" y="150" fill="#F8F3E3" class="b">▸ improve testing, security and delivery</text><text x="24" y="184" fill="#F8F3E3" class="b">▸ explore practical AI engineering</text><text x="24" y="218" fill="#A7A18E" class="s">progress is shown through repositories and shipped work</text></g><g transform="translate(624 190)"><rect width="520" height="240" rx="18" fill="#111612" stroke="#51441D"/><text x="24" y="40" fill="#E6C87A" class="k">WORKING RHYTHM</text><rect x="24" y="72" width="420" height="16" rx="8" fill="#201B12"/><rect x="24" y="72" width="342" height="16" rx="8" fill="#E6C87A"/><text x="464" y="85" text-anchor="end" fill="#F8F3E3" class="s">build</text><rect x="24" y="116" width="420" height="16" rx="8" fill="#201B12"/><rect x="24" y="116" width="365" height="16" rx="8" fill="#C7A852"/><text x="464" y="129" text-anchor="end" fill="#F8F3E3" class="s">learn</text><rect x="24" y="160" width="420" height="16" rx="8" fill="#201B12"/><rect x="24" y="160" width="315" height="16" rx="8" fill="#AE8A34"/><text x="464" y="173" text-anchor="end" fill="#F8F3E3" class="s">verify</text><rect x="24" y="204" width="420" height="16" rx="8" fill="#201B12"/><rect x="24" y="204" width="276" height="16" rx="8" fill="#8E6D23"/><text x="464" y="217" text-anchor="end" fill="#F8F3E3" class="s">ship</text></g><text x="56" y="477" fill="#E6C87A" class="s">OPEN: repositories · contribution history · pull requests</text></svg>