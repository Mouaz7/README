<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Verified engineering evidence</title>
<desc id="desc">Concrete signals from public engineering work instead of decorative progress scores.</desc>
<defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px}.head{font-size:31px;font-weight:900}.sub{font-size:14px}.k{font-size:16px;font-weight:900}.label{font-size:10px;font-weight:900;letter-spacing:1.2px}.body{font-size:13px}.metric{font-size:24px;font-weight:900}.note{font-size:12px}</style>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#137F68"/><stop offset=".55" stop-color="#247D8A"/><stop offset="1" stop-color="#946D1D"/></linearGradient>
<radialGradient id="glow" cx="15%" cy="0" r="85%"><stop stop-color="#137F68" stop-opacity=".13"/><stop offset="1" stop-color="#F5F2EA" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#B8D4C9" stroke-width=".6" opacity=".22"/></pattern>
</defs>
<rect width="1200" height="500" rx="26" fill="#F5F2EA"/>
<rect width="1200" height="500" rx="26" fill="url(#glow)"/>
<rect width="1200" height="500" rx="26" fill="url(#grid)"/>
<rect x="4" y="4" width="1192" height="492" rx="23" fill="none" stroke="url(#border)" stroke-width="2"/>
<text x="42" y="47" class="eyebrow" fill="#137F68">EVIDENCE.LOG / PUBLIC WORK / VERIFIED SIGNALS</text>
<text x="42" y="88" class="head" fill="#10231C">Measured behavior, safety controls and shipped systems.</text>
<text x="42" y="116" class="sub" fill="#5D776D">No decorative skill percentages. Every signal maps to a repository or implementation.</text>

<g transform="translate(42 148)">
<rect width="535" height="286" rx="18" fill="#FFFFFF" stroke="#B8D4C9"/>
<text x="25" y="38" class="k" fill="#137F68">CURRENT BUILD / AI-ASSISTED DEVOPS</text>
<line x1="25" y1="55" x2="510" y2="55" stroke="#D5E2DD"/>
<text x="25" y="91" class="metric" fill="#10231C">6</text>
<text x="63" y="89" class="body" fill="#10231C">specialized agents coordinated through an orchestrator</text>
<text x="25" y="129" class="label" fill="#946D1D">CONTROL</text>
<text x="112" y="129" class="body" fill="#10231C">human approval is required before merge</text>
<text x="25" y="165" class="label" fill="#946D1D">SAFETY</text>
<text x="112" y="165" class="body" fill="#10231C">traffic-light decisions · protected paths · audit trail</text>
<text x="25" y="201" class="label" fill="#946D1D">QUALITY</text>
<text x="112" y="201" class="body" fill="#10231C">Bandit · Pylint · secret scanning · retry limits</text>
<text x="25" y="237" class="label" fill="#946D1D">OBSERVE</text>
<text x="112" y="237" class="body" fill="#10231C">Prometheus metrics · Slack reports · structured PRs</text>
<rect x="25" y="255" width="485" height="1" fill="#D5E2DD"/>
<text x="25" y="276" class="note" fill="#5D776D">Bachelor thesis engineering artifact · BTH · Python</text>
</g>

<g transform="translate(623 148)">
<rect width="535" height="286" rx="18" fill="#FFFFFF" stroke="#B8D4C9"/>
<text x="25" y="38" class="k" fill="#946D1D">ENGINEERING SIGNALS</text>
<line x1="25" y1="55" x2="510" y2="55" stroke="#D5E2DD"/>
<text x="25" y="101" class="metric" fill="#137F68">667</text>
<text x="91" y="98" class="body" fill="#10231C">automated tests documented in the project suite</text>
<text x="25" y="141" class="label" fill="#247D8A">SYSTEMS</text>
<text x="112" y="141" class="body" fill="#10231C">threads · IPC · synchronization · filesystems</text>
<text x="25" y="177" class="label" fill="#247D8A">PRODUCT</text>
<text x="112" y="177" class="body" fill="#10231C">Android · Firebase · realtime application flows</text>
<text x="25" y="213" class="label" fill="#247D8A">DELIVERY</text>
<text x="112" y="213" class="body" fill="#10231C">Git · Docker · CI/CD · reviewable changes</text>
<rect x="25" y="235" width="485" height="1" fill="#D5E2DD"/>
<text x="25" y="260" class="note" fill="#5D776D">Proof is shown through source code, tests and project documentation.</text>
</g>

<text x="42" y="472" class="note" fill="#137F68">STATUS: building reliable software with observable and reviewable behavior</text>
</svg>