<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Verified engineering evidence</title><desc id="desc">Concrete engineering evidence in a consistent gold theme.</desc><defs><style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px}.head{font-size:31px;font-weight:900}.sub{font-size:14px}.k{font-size:16px;font-weight:900}.label{font-size:10px;font-weight:900;letter-spacing:1.2px}.body{font-size:13px}.metric{font-size:24px;font-weight:900}.note{font-size:12px}</style><linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F3D98C"/><stop offset=".55" stop-color="#E6C87A"/><stop offset="1" stop-color="#B98212"/></linearGradient><radialGradient id="glow" cx="15%" cy="0" r="85%"><stop stop-color="#E6C87A" stop-opacity=".15"/><stop offset="1" stop-color="#FFF9EB" stop-opacity="0"/></radialGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E6D6A6" stroke-width=".6" opacity=".24"/></pattern></defs><rect width="1200" height="500" rx="26" fill="#FFF9EB"/><rect width="1200" height="500" rx="26" fill="url(#glow)"/><rect width="1200" height="500" rx="26" fill="url(#grid)"/><rect x="4" y="4" width="1192" height="492" rx="23" fill="none" stroke="url(#border)" stroke-width="2"/><text x="42" y="47" class="eyebrow" fill="#B98212">EVIDENCE.LOG / PUBLIC WORK / VERIFIED SIGNALS</text><text x="42" y="88" class="head" fill="#17140E">Measured behavior, safety controls and shipped systems.</text><text x="42" y="116" class="sub" fill="#74684A">No decorative skill percentages. Every signal maps to a repository or implementation.</text><g transform="translate(42 148)"><rect width="535" height="286" rx="18" fill="#FFFFFF" stroke="#E6D6A6"/><text x="25" y="38" class="k" fill="#B98212">CURRENT BUILD / AI-ASSISTED DEVOPS</text><line x1="25" y1="55" x2="510" y2="55" stroke="#E6D6A6"/><text x="25" y="91" class="metric" fill="#B98212">6</text><text x="63" y="89" class="body" fill="#17140E">specialized agents coordinated through an orchestrator</text><text x="25" y="129" class="label" fill="#B98212">CONTROL</text><text x="112" y="129" class="body" fill="#17140E">human approval is required before merge</text><text x="25" y="165" class="label" fill="#B98212">SAFETY</text><text x="112" y="165" class="body" fill="#17140E">traffic-light decisions · protected paths · audit trail</text><text x="25" y="201" class="label" fill="#B98212">QUALITY</text><text x="112" y="201" class="body" fill="#17140E">Bandit · Pylint · secret scanning · retry limits</text><text x="25" y="237" class="label" fill="#B98212">OBSERVE</text><text x="112" y="237" class="body" fill="#17140E">Prometheus metrics · Slack reports · structured PRs</text><line x1="25" y1="255" x2="510" y2="255" stroke="#E6D6A6"/><text x="25" y="276" class="note" fill="#74684A">Bachelor thesis engineering artifact · BTH · Python</text></g><g transform="translate(623 148)"><rect width="535" height="286" rx="18" fill="#FFFFFF" stroke="#E6D6A6"/><text x="25" y="38" class="k" fill="#B98212">ENGINEERING SIGNALS</text><line x1="25" y1="55" x2="510" y2="55" stroke="#E6D6A6"/><text x="25" y="101" class="metric" fill="#B98212">667</text><text x="91" y="98" class="body" fill="#17140E">automated tests documented in the project suite</text><text x="25" y="141" class="label" fill="#B98212">SYSTEMS</text><text x="112" y="141" class="body" fill="#17140E">threads · IPC · synchronization · filesystems</text><text x="25" y="177" class="label" fill="#B98212">PRODUCT</text><text x="112" y="177" class="body" fill="#17140E">Android · Firebase · realtime application flows</text><text x="25" y="213" class="label" fill="#B98212">DELIVERY</text><text x="112" y="213" class="body" fill="#17140E">Git · Docker · CI/CD · reviewable changes</text><line x1="25" y1="235" x2="510" y2="235" stroke="#E6D6A6"/><text x="25" y="260" class="note" fill="#74684A">Proof is shown through source code, tests and project documentation.</text></g><text x="42" y="472" class="note" fill="#B98212">STATUS: building reliable software with observable and reviewable behavior</text></svg>