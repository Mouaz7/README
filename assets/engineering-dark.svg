  <text x="25" y="135" class="metric" fill="#E6C87A">DESIGN → BUILD → TEST</text>
  <text x="25" y="159" class="metric2" fill="#B8AA82">CONCURRENCY / MEMORY / IO</text>
</g><g transform="translate(594,160)">
  <rect width="250" height="180" rx="18" fill="#151710" stroke="#51441D"/>
  <circle cx="31" cy="31" r="20" fill="#211C0D" stroke="#F3D98C"/>
  <text x="31" y="36" text-anchor="middle" class="icon" fill="#E6C87A">AI</text>
  <text x="61" y="35" class="cardTitle" fill="#FFF7DB">AI ENGINEERING</text>
  <text x="25" y="82" class="cardDesc" fill="#B8AA82">agents · evaluation · safe automation</text>
