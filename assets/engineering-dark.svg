<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-labelledby="title desc">
<title id="title">Engineering operating model</title>
<desc id="desc">A gold themed operating model for backend systems, systems engineering, AI engineering and delivery quality.</desc>
<defs><style>
text{font-family:Inter,Segoe UI,Arial,sans-serif}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:2.5px}
.head{font-size:34px;font-weight:850}
.sub{font-size:15px}
.icon{font-family:SFMono-Regular,Consolas,monospace;font-size:13px;font-weight:900}
.cardTitle{font-family:SFMono-Regular,Consolas,monospace;font-size:11.5px;font-weight:900}
.cardDesc{font-family:SFMono-Regular,Consolas,monospace;font-size:10.2px}
.metric{font-family:SFMono-Regular,Consolas,monospace;font-size:10px;font-weight:900;letter-spacing:.3px}
.metric2{font-family:SFMono-Regular,Consolas,monospace;font-size:9px;font-weight:700;letter-spacing:.35px}
</style>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A97918"/><stop offset=".5" stop-color="#F3D98C"/><stop offset="1" stop-color="#E6C87A"/></linearGradient>
<radialGradient id="glow" cx="20%" cy="0" r="90%"><stop stop-color="#F3D98C" stop-opacity=".15"/><stop offset="1" stop-color="#0C0E0B" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1180" height="400" rx="26" fill="#0C0E0B"/>
<rect width="1180" height="400" rx="26" fill="url(#glow)"/>
<rect x="3" y="3" width="1174" height="394" rx="23" fill="none" stroke="url(#gold)" stroke-width="2"/>
<text x="40" y="48" class="eyebrow" fill="#E6C87A">✦ ENGINEERING SYSTEM / HOW I WORK</text>
<text x="40" y="94" class="head" fill="#FFF7DB">From architecture decisions to reliable delivery.</text>
<text x="40" y="122" class="sub" fill="#B8AA82">Explicit boundaries, failure handling, verification and measurable behavior.</text>
