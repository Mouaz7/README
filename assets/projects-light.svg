<text x="25" y="58" class="name" fill="#10231C">CAMPUS360</text>
<text x="25" y="84" class="body" fill="#5D776D">Kotlin · Android · Firebase</text>
<line x1="25" y1="99" x2="510" y2="99" stroke="#D5E2DD"/>
<text x="25" y="121" class="label" fill="#137F68">RESPONSIBILITY</text>
<text x="146" y="121" class="body" fill="#10231C">application structure · auth · navigation · cloud state</text>
<text x="25" y="148" class="label" fill="#137F68">EVIDENCE</text>
<text x="111" y="148" class="proof" fill="#10231C">structured architecture · reliable user flows</text>
</g>

<g transform="translate(42 340)">
<rect width="535" height="170" rx="18" fill="#FFFFFF" stroke="#B8D4C9"/>
<rect width="6" height="170" rx="3" fill="#247D8A"/>
<text x="25" y="31" class="id" fill="#247D8A">03 / SYSTEMS</text>
<text x="25" y="58" class="name" fill="#10231C">CONCURRENCY SYSTEMS</text>
<text x="25" y="84" class="body" fill="#5D776D">C · POSIX · Linux</text>
<line x1="25" y1="99" x2="510" y2="99" stroke="#D5E2DD"/>
<text x="25" y="121" class="label" fill="#946D1D">RESPONSIBILITY</text>
<text x="146" y="121" class="body" fill="#10231C">processes · threads · IPC · synchronization</text>
