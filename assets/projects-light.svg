<text x="25" y="84" class="body" fill="#5D776D">C++20 · SFML 3.0</text>
<line x1="25" y1="99" x2="510" y2="99" stroke="#D5E2DD"/>
<text x="25" y="121" class="label" fill="#946D1D">RESPONSIBILITY</text>
<text x="146" y="121" class="body" fill="#10231C">rule engine · timers · history · interface behavior</text>
<text x="25" y="148" class="label" fill="#946D1D">EVIDENCE</text>
