<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Selected engineering projects</title>
<desc id="desc">Four selected projects showing stack, responsibility and concrete engineering evidence.</desc>
<defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px}.head{font-size:31px;font-weight:900}.sub{font-size:14px}.id{font-size:11px;font-weight:900;letter-spacing:1.5px}.name{font-size:17px;font-weight:900}.label{font-size:10px;font-weight:900;letter-spacing:1.2px}.body{font-size:12.5px}.proof{font-size:12px;font-weight:800}</style>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#137F68"/><stop offset=".55" stop-color="#247D8A"/><stop offset="1" stop-color="#946D1D"/></linearGradient>
<radialGradient id="glow" cx="82%" cy="5%" r="85%"><stop stop-color="#137F68" stop-opacity=".13"/><stop offset="1" stop-color="#F5F2EA" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#B8D4C9" stroke-width=".6" opacity=".22"/></pattern>
</defs>
<rect width="1200" height="560" rx="26" fill="#F5F2EA"/>
<rect width="1200" height="560" rx="26" fill="url(#glow)"/>
<rect width="1200" height="560" rx="26" fill="url(#grid)"/>
<rect x="4" y="4" width="1192" height="552" rx="23" fill="none" stroke="url(#border)" stroke-width="2"/>
<text x="42" y="47" class="eyebrow" fill="#137F68">PROJECT INDEX / SELECTED ENGINEERING EVIDENCE</text>
<text x="42" y="88" class="head" fill="#10231C">Work that demonstrates architecture, systems and delivery.</text>
<text x="42" y="116" class="sub" fill="#5D776D">Each card states the stack, the engineering responsibility and the evidence.</text>

<g transform="translate(42 145)">
<rect width="535" height="170" rx="18" fill="#FFFFFF" stroke="#B8D4C9"/>
<rect width="6" height="170" rx="3" fill="#137F68"/>
<text x="25" y="31" class="id" fill="#137F68">01 / AI DEVOPS</text>
<text x="25" y="58" class="name" fill="#10231C">AUTO-HEALING AI DEVOPS</text>
<text x="25" y="84" class="body" fill="#5D776D">Python · MCP · CI/CD · Prometheus</text>
<line x1="25" y1="99" x2="510" y2="99" stroke="#D5E2DD"/>
<text x="25" y="121" class="label" fill="#946D1D">RESPONSIBILITY</text>
<text x="146" y="121" class="body" fill="#10231C">agent architecture · orchestration · safety controls</text>
<text x="25" y="148" class="label" fill="#946D1D">EVIDENCE</text>
<text x="111" y="148" class="proof" fill="#10231C">667 tests · HITL enforced · security gates</text>
</g>

<g transform="translate(623 145)">
<rect width="535" height="170" rx="18" fill="#FFFFFF" stroke="#B8D4C9"/>
<rect width="6" height="170" rx="3" fill="#946D1D"/>
