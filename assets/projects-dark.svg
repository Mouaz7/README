<text x="25" y="84" class="body" fill="#9BB0A7">C++20 · SFML 3.0</text>
<line x1="25" y1="99" x2="510" y2="99" stroke="#315047"/>
<text x="25" y="121" class="label" fill="#E6C87A">RESPONSIBILITY</text>
<text x="146" y="121" class="body" fill="#E8EFEA">rule engine · timers · history · interface behavior</text>
<text x="25" y="148" class="label" fill="#E6C87A">EVIDENCE</text>
