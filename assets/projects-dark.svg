<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Selected engineering projects</title>
<desc id="desc">Four selected projects showing stack, responsibility and concrete engineering evidence.</desc>
<defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px}.head{font-size:31px;font-weight:900}.sub{font-size:14px}.id{font-size:11px;font-weight:900;letter-spacing:1.5px}.name{font-size:17px;font-weight:900}.label{font-size:10px;font-weight:900;letter-spacing:1.2px}.body{font-size:12.5px}.proof{font-size:12px;font-weight:800}</style>
<linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42BFA3"/><stop offset=".55" stop-color="#56B7C8"/><stop offset="1" stop-color="#E6C87A"/></linearGradient>
<radialGradient id="glow" cx="82%" cy="5%" r="85%"><stop stop-color="#42BFA3" stop-opacity=".12"/><stop offset="1" stop-color="#0D1714" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#315047" stroke-width=".6" opacity=".32"/></pattern>
</defs>
<rect width="1200" height="560" rx="26" fill="#0D1714"/>
<rect width="1200" height="560" rx="26" fill="url(#glow)"/>
<rect width="1200" height="560" rx="26" fill="url(#grid)"/>
<rect x="4" y="4" width="1192" height="552" rx="23" fill="none" stroke="url(#border)" stroke-width="2"/>
<text x="42" y="47" class="eyebrow" fill="#42BFA3">PROJECT INDEX / SELECTED ENGINEERING EVIDENCE</text>
<text x="42" y="88" class="head" fill="#E8EFEA">Work that demonstrates architecture, systems and delivery.</text>
<text x="42" y="116" class="sub" fill="#9BB0A7">Each card states the stack, the engineering responsibility and the evidence.</text>

<g transform="translate(42 145)">
<rect width="535" height="170" rx="18" fill="#12241E" stroke="#315047"/>
<rect width="6" height="170" rx="3" fill="#42BFA3"/>
<text x="25" y="31" class="id" fill="#42BFA3">01 / AI DEVOPS</text>
<text x="25" y="58" class="name" fill="#E8EFEA">AUTO-HEALING AI DEVOPS</text>
<text x="25" y="84" class="body" fill="#9BB0A7">Python · MCP · CI/CD · Prometheus</text>
<line x1="25" y1="99" x2="510" y2="99" stroke="#315047"/>
<text x="25" y="121" class="label" fill="#E6C87A">RESPONSIBILITY</text>
<text x="146" y="121" class="body" fill="#E8EFEA">agent architecture · orchestration · safety controls</text>
<text x="25" y="148" class="label" fill="#E6C87A">EVIDENCE</text>
<text x="111" y="148" class="proof" fill="#E8EFEA">667 tests · HITL enforced · security gates</text>
</g>

<g transform="translate(623 145)">
<rect width="535" height="170" rx="18" fill="#12241E" stroke="#315047"/>
<rect width="6" height="170" rx="3" fill="#E6C87A"/>
