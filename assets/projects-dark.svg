<text x="146" y="121" class="body" fill="#E8EFEA">application structure · auth · navigation · cloud state</text>
<text x="25" y="148" class="label" fill="#42BFA3">EVIDENCE</text>
<text x="111" y="148" class="proof" fill="#E8EFEA">structured architecture · reliable user flows</text>
</g>

<g transform="translate(42 340)">
<rect width="535" height="170" rx="18" fill="#12241E" stroke="#315047"/>
<rect width="6" height="170" rx="3" fill="#56B7C8"/>
<text x="25" y="31" class="id" fill="#56B7C8">03 / SYSTEMS</text>
<text x="25" y="58" class="name" fill="#E8EFEA">CONCURRENCY SYSTEMS</text>
<text x="25" y="84" class="body" fill="#9BB0A7">C · POSIX · Linux</text>
<line x1="25" y1="99" x2="510" y2="99" stroke="#315047"/>
<text x="25" y="121" class="label" fill="#E6C87A">RESPONSIBILITY</text>
<text x="146" y="121" class="body" fill="#E8EFEA">processes · threads · IPC · synchronization</text>
