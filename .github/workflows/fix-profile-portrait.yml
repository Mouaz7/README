name: Fix animated gold portrait

on:
  push:
    paths:
      - ".github/workflows/fix-profile-portrait.yml"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace portrait and add motion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          svg_path = Path("assets/profile-light.svg")
          portrait_path = Path("assets/mouaz-portrait-gold.jpg")
          svg = svg_path.read_text(encoding="utf-8")
          image_b64 = base64.b64encode(portrait_path.read_bytes()).decode("ascii")

          portrait = (
              '<g>'
              '<animateTransform attributeName="transform" type="translate" '
              'values="0 0;0 -4;0 0" dur="5.6s" repeatCount="indefinite"/>'
              f'<image href="data:image/jpeg;base64,{image_b64}" '
              'x="800" y="125" width="328" height="493" '
              'preserveAspectRatio="xMidYMin meet"/>'
              '</g>'
          )

          svg, image_count = re.subn(
              r'<image href="data:image/(?:jpeg|jpg|png|webp);base64,[^"]+"[^>]*/>',
              portrait,
              svg,
              count=1,
              flags=re.S,
          )
          if image_count != 1:
              raise SystemExit("Could not locate the embedded portrait")

          hud_open = '<g fill="none" stroke="#d9a53a" opacity=".24">'
          if hud_open in svg and 'from="0 964 321"' not in svg:
              svg = svg.replace(
                  hud_open,
                  hud_open + '<animateTransform attributeName="transform" type="rotate" '
                  'from="0 964 321" to="360 964 321" dur="20s" '
                  'repeatCount="indefinite"/>',
                  1,
              )

          scan = (
              '<rect x="795" y="142" width="338" height="6" '
              'fill="url(#l)" opacity=".9">'
              '<animate attributeName="y" values="142;514;142" '
              'dur="4.4s" repeatCount="indefinite"/>'
              '</rect>'
          )
          svg, scan_count = re.subn(
              r'<rect x="795" y="142" width="338" height="6"[^>]*/>',
              scan,
              svg,
              count=1,
          )
          if scan_count == 0:
              svg = svg.replace(
                  '</g><path d="M802 151',
                  scan + '</g><path d="M802 151',
                  1,
              )

          required = (
              'values="0 0;0 -4;0 0"',
              'values="142;514;142"',
              'data:image/jpeg;base64,',
          )
          if not all(value in svg for value in required):
              raise SystemExit("Animation validation failed")

          svg_path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit profile update
        shell: bash
        run: |
          git config user.name "Mouaz Naji"
          git config user.email "150366708+Mouaz7@users.noreply.github.com"
          git add assets/profile-light.svg
          git commit -m "Fix animated gold profile portrait" || exit 0
          git push
