name: Fix profile portrait

on:
  push:
    paths:
      - ".github/workflows/fix-profile-portrait.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace broken embedded portrait
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          portrait_b64 = ""

          raw = base64.b64decode(portrait_b64)
          assert raw[:4] == b"RIFF" and raw[8:12] == b"WEBP"

          image_tag = (
              f'<image href="data:image/webp;base64,{portrait_b64}" '
              'x="810" y="122" width="308" height="520" '
              'preserveAspectRatio="xMidYMin meet"/>'
          )

          pattern = re.compile(r'<image href="data:image/webp;base64,[^"]+"[^>]*/>')
          for filename in ("assets/profile-light.svg", "assets/profile-dark.svg"):
              path = Path(filename)
              svg = path.read_text(encoding="utf-8")
              svg, count = pattern.subn(image_tag, svg, count=1)
              if count != 1:
                  raise SystemExit(f"Could not replace portrait in {filename}")
              path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit fixed portraits
        shell: bash
        run: |
          git config user.name "Mouaz Naji"
          git config user.email "150366708+Mouaz7@users.noreply.github.com"
          git add assets/profile-light.svg assets/profile-dark.svg
          git commit -m "Fix embedded profile portrait" || exit 0
          git push
