name: Apply animated profile portrait

on:
  push:
    paths:
      - ".github/workflows/apply-profile-now.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clear animated portrait
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          svg_path = Path("assets/profile-light.svg")
          portrait_path = Path("assets/mouaz-portrait-gold.jpg")
          svg = svg_path.read_text(encoding="utf-8")
          portrait_b64 = base64.b64encode(portrait_path.read_bytes()).decode("ascii")

          animated_portrait = (
              '<g>'
              '<animateTransform attributeName="transform" type="translate" '
              'values="0 0;0 -4;0 0" dur="5.6s" repeatCount="indefinite"/>'
              f'<image href="data:image/jpeg;base64,{portrait_b64}" '
              'x="800" y="125" width="328" height="493" '
              'preserveAspectRatio="xMidYMin meet"/>'
              '</g>'
          )

          svg, count = re.subn(
              r'<image href="data:image/(?:jpeg|jpg|png|webp);base64,[^"]+"[^>]*/>',
              animated_portrait,
              svg,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("Embedded portrait was not found")

          hud = '<g fill="none" stroke="#d9a53a" opacity=".24">'
          if hud in svg and 'from="0 964 321"' not in svg:
              svg = svg.replace(
                  hud,
                  hud + '<animateTransform attributeName="transform" type="rotate" '
                  'from="0 964 321" to="360 964 321" dur="20s" '
                  'repeatCount="indefinite"/>',
                  1,
              )

          scan = (
              '<rect x="795" y="142" width="338" height="6" '
              'fill="url(#l)" opacity=".9">'
              '<animate attributeName="y" values="142;514;142" '
              'dur="4.4s" repeatCount="indefinite"/>'
              '</rect>'
          )
          svg, scan_count = re.subn(
              r'<rect x="795" y="142" width="338" height="6"[^>]*(?:/>|>.*?</rect>)',
              scan,
              svg,
              count=1,
              flags=re.S,
          )
          if scan_count == 0:
              svg = svg.replace('</g><path d="M802 151', scan + '</g><path d="M802 151', 1)

          if not all(token in svg for token in (
              'values="0 0;0 -4;0 0"',
              'values="142;514;142"',
              'data:image/jpeg;base64,',
          )):
              raise SystemExit("Animation validation failed")

          svg_path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit result
        shell: bash
        run: |
          git config user.name "Mouaz Naji"
          git config user.email "150366708+Mouaz7@users.noreply.github.com"
          git add assets/profile-light.svg
          git commit -m "Install clear animated gold portrait" || exit 0
          git push
