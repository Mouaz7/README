name: Animate profile hero

on:
  push:
    paths:
      - ".github/workflows/animate-profile.yml"

permissions:
  contents: write

jobs:
  animate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add gold scan animations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("assets/profile-light.svg")
          svg = path.read_text(encoding="utf-8")

          if 'class="scan"' in svg:
              raise SystemExit("Profile animation already exists")

          css = (
              '.pulse{animation:pulse 1.8s ease-in-out infinite}'
              '.scan{animation:scan 5.2s ease-in-out infinite}'
              '.hud{animation:hud 18s linear infinite;transform-box:fill-box;transform-origin:center}'
              '@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}'
              '@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(354px)}}'
              '@keyframes hud{to{transform:rotate(360deg)}}'
              '@media(prefers-reduced-motion:reduce){.pulse,.scan,.hud{animation:none!important}}'
          )
          svg = svg.replace('</style>', css + '</style>', 1)

          scan_gradient = (
              '<linearGradient id="scanLine" x1="0" y1="0" x2="1" y2="0">'
              '<stop offset="0" stop-color="#E1B74F" stop-opacity="0"/>'
              '<stop offset=".5" stop-color="#E1B74F" stop-opacity=".78"/>'
              '<stop offset="1" stop-color="#E1B74F" stop-opacity="0"/>'
              '</linearGradient>'
          )
          svg = svg.replace('<clipPath id="c">', scan_gradient + '<clipPath id="c">', 1)
          svg = svg.replace(
              '<circle cx="1089" cy="44" r="4.6" fill="#c58d19"/>',
              '<circle cx="1089" cy="44" r="4.6" fill="#c58d19" class="pulse"/>',
              1,
          )
          svg = svg.replace(
              '<rect x="456" y="176" width="14" height="49" rx="2" fill="#c48b16"/>',
              '<rect x="456" y="176" width="14" height="49" rx="2" fill="#c48b16" class="pulse"/>',
              1,
          )
          svg = svg.replace(
              '<rect x="671" y="568" width="7" height="17" fill="#c48b16"/>',
              '<rect x="671" y="568" width="7" height="17" fill="#c48b16" class="pulse"/>',
              1,
          )
          svg = svg.replace(
              '<g fill="none" stroke="#d9a53a" opacity=".28">',
              '<g fill="none" stroke="#d9a53a" opacity=".28" class="hud">',
              1,
          )
          svg = svg.replace(
              'preserveAspectRatio="xMidYMin meet"/></g><path d="M802 151',
              'preserveAspectRatio="xMidYMin meet"/>'
              '<rect x="795" y="142" width="338" height="6" fill="url(#scanLine)" opacity=".82" class="scan"/>'
              '</g><path d="M802 151',
              1,
          )

          required = ['class="scan"', 'class="hud"', '@keyframes pulse']
          if not all(item in svg for item in required):
              raise SystemExit("Animation injection failed")

          path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit animated SVG
        shell: bash
        run: |
          git config user.name "Mouaz Naji"
          git config user.email "150366708+Mouaz7@users.noreply.github.com"
          git add assets/profile-light.svg
          git commit -m "Animate gold profile hero" || exit 0
          git push
